name: Clav Keyboard CI

on:
  push:
    branches: [ main ]
    tags: [ "v*", "clav-v*" ]
    paths:
      - 'clav/**'
      - '.github/workflows/clav-android.yml'
  pull_request:
    paths:
      - 'clav/**'
      - '.github/workflows/clav-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Clav APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clav
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships with the Android SDK preinstalled (ANDROID_HOME).
      - name: Check Android SDK
        run: echo "SDK=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clav-debug-apk
          path: clav/app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: gradle assembleRelease --no-daemon

      - name: Attach release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clav/app/build/outputs/apk/release/*.apk
