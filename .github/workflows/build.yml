name: Build Android APK

on:
  push:
    branches: [ main, agent/api-unification ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Write KRUX builder config
      env:
        KRUX_BUILDER_TOKEN: ${{ secrets.KRUX_BUILDER_TOKEN }}
      run: |
        mkdir -p app/src/main/assets
        printf '{"token":"%s","weekly_quota":2}' "$KRUX_BUILDER_TOKEN" > app/src/main/assets/krux_builder.json

    - name: Build Debug APK
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        HF_API_KEY: ${{ secrets.HF_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: gradle assembleDebug --no-daemon

    - name: Print Debug Certificate Fingerprints
      continue-on-error: true
      run: |
        mkdir -p "$HOME/.android"
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KruxAI-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
