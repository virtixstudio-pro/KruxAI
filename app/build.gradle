plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.virtixstudio.kruxai'
    compileSdk 34

    defaultConfig {
        applicationId "com.virtixstudio.kruxai"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "1.1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Injection des clés API via les variables d'environnement
        String groqKey = System.getenv("GROQ_API_KEY") ?: ""
        String cerebrasKey = System.getenv("CEREBRAS_API_KEY") ?: ""
        String mistralKey = System.getenv("MISTRAL_API_KEY") ?: ""
        String hfKey = System.getenv("HF_API_KEY") ?: ""
        String geminiKey = System.getenv("GEMINI_API_KEY") ?: ""

        buildConfigField "String", "GROQ_API_KEY", "\"${groqKey}\""
        buildConfigField "String", "CEREBRAS_API_KEY", "\"${cerebrasKey}\""
        buildConfigField "String", "MISTRAL_API_KEY", "\"${mistralKey}\""
        buildConfigField "String", "HF_API_KEY", "\"${hfKey}\""
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'io.noties.markwon:core:4.6.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // HTTP Client (Groq)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
