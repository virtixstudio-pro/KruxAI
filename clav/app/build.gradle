plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clav.keyboard'
    compileSdk 35

    defaultConfig {
        applicationId "com.clav.keyboard"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            // Kept simple and installable: signed with the debug key by CI.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Accented letters and emoji live in Java sources: force UTF-8.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
