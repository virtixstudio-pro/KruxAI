<main class="auth">
<h1>Se connecter</h1>
<p class="sub2">Utilise ton compte Krux ou ton compte Google.</p>
<button class="btn" id="google" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.600 10.8l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>Continuer avec Google</button>
<div class="sep">ou</div>
<form id="f" novalidate>
<div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
<div><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required></div>
<button class="btn primary" id="go" type="submit">Se connecter</button>
</form>
<p class="msg" id="msg" role="status"></p>
<button class="linkbtn" id="reset" type="button">Mot de passe oublié ?</button>
<p style="color:var(--mute);font-size:14px;margin-top:20px">Pas encore de compte ? Crée-le dans l'application Krux, puis reviens ici.</p>
</main>
